<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src 'self' https://*.supabase.co; worker-src 'self'; style-src 'self'; img-src 'self' data:; form-action 'none'; base-uri 'none'"><title>Quotes · Road &amp; Shop</title><link rel="stylesheet" href="style.css"></head><body data-auth-pending><header><span class="mark">R/S</span><strong>Road &amp; Shop</strong></header><p id="auth-status" role="status">Checking your sign-in…</p><div class="card workspace-heading"><span id="workspace-status" role="status"></span><div class="workspace-nav" role="navigation" aria-label="Workspace navigation"><a href="workspace.html">Dashboard</a> <a href="account.html?switch=1">Switch business / account</a> <button id="signout" hidden>Log out</button></div></div><main><section id="list"><div class="heading"><h1>Mechanic quotes</h1><button id="new" class="primary">New quote</button></div><details class="card"><summary>Shop rates</summary><form id="rateForm" class="qform"><label>Default parts markup (%)<input id="defaultMarkup" type="number" min="0" max="1000" step=".01" required></label><label>Default labor rate ($/hour)<input id="defaultHourly" type="number" min="0" max="999999" step=".01" required></label><label>Default mileage charge ($/mile)<input id="defaultMileage" type="number" step=".01" min="0" max="999999"></label><button>Save shop rates</button></form></details><h2>Active work orders</h2><div id="cards"></div><details class="card"><summary id="paidCount">Paid history</summary><div id="paidCards"></div></details><details class="card"><summary>Quote backups</summary><p>Save quotes separately from your ledger. Backups include private costs.</p><button id="export">Export quotes</button><label>Import quotes <input id="import" type="file" accept=".json"></label></details></section>
<section id="compose" hidden><h1 id="editTitle">New quote</h1><form id="form" class="qform"><div class="card"><label>Shop or mechanic<input id="shop" maxlength="80" required></label><label>Shop contact (phone or email)<input id="contact" maxlength="100" required></label><label>Customer<input id="customer" maxlength="80" required></label><label>Vehicle<input id="vehicle" maxlength="100"></label><label>Repair description<textarea id="description" maxlength="420" required></textarea></label><label>Valid through<input id="expires" type="date" required></label></div><div class="card"><h2>Pricing for this quote</h2><div class="qgrid"><label>Parts markup (%)<input id="markup" type="number" min="0" max="1000" step=".01"></label><label>Labor rate ($/hour)<input id="hourly" type="number" min="0" max="999999" step=".01"></label></div><label>Mileage charge ($/mile)<input id="mileageRate" type="number" min="0" max="999999" step=".01"></label><button type="button" id="remember">Save as shop defaults</button></div><div class="card"><h2>Parts, labor &amp; fees</h2><div id="items"></div><button type="button" id="additem">Add part</button> <button type="button" id="addLabor">Add labor</button> <button type="button" id="addMileage">Add mileage</button> <button type="button" id="addFee">Add fee / manual line</button></div><div class="card"><label>Estimated tax amount ($)<input id="tax" type="number" min="0" max="999999" step=".01" value="0" required></label><p class="qtotal" id="calc"></p></div><button class="primary">Save and preview</button> <button type="button" id="cancel">Cancel</button></form></section><section id="view" hidden></section><p id="status" role="status"></p></main><nav><a class="navlink" href="./?ledger">Ledger</a><a class="navlink" href="quotes.html" aria-current="page">Quotes</a></nav><script src="pdf-lib.min.js"></script><script src="quote-core.js"></script><script src="core/occupations.js"></script><script src="core/finance.js"></script><script src="core/accounting.js"></script><script src="core/planning.js"></script><script src="cloud/config.js"></script><script src="cloud/client.js"></script><script src="cloud/storage.js"></script><script id="entry-script" src="cloud/bootstrap.js" data-src="quotes.js"></script><script src="./quote-update.js"></script></body></html>
