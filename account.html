<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://*.supabase.co; form-action 'none'; base-uri 'none'"><title>Account · Road &amp; Shop</title><link rel="stylesheet" href="style.css"></head>
<body><header><span class="mark">R/S</span><strong>Road &amp; Shop</strong></header><main>
<h1>Sign in to Road &amp; Shop</h1><p role="status" id="notice"></p>
<section hidden id="guest" class="card"><form id="credentials"><label>Email<input type="email" autocomplete="email" required id="email"></label><label>Password<input type="password" autocomplete="current-password" id="password" required></label><button value="login">Sign in</button> <button value="signup">Create account</button></form><button id="google">Continue with Google</button><button id="reset">Email a recovery link</button><button id="resend">Resend verification email</button></section>
<section hidden id="member" class="card"><p id="identity"></p><h2>Your businesses</h2><div id="businesses"></div><button id="start-setup" class="primary" hidden>Set up my business</button><form id="create" hidden><label>Business name<input maxlength="80" id="business" required></label><button>Create workspace</button></form><details><summary>Change password</summary><form id="change"><label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label><button>Save password</button></form></details><button id="logout">Sign out on this device</button></section>
<p>Existing device records remain in this browser and can be imported into an empty business after sign-in.</p></main><script src="cloud/config.js"></script><script src="cloud/client.js"></script><script src="cloud/account.js"></script><script src="quote-update.js"></script></body></html>
