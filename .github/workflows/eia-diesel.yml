name: Refresh EIA weekly diesel
on:
  schedule:
    - cron: '23 23 * * 1,2,3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eia-diesel-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check parser and refresh public data
        run: |
          python3 .github/scripts/update-eia-diesel.py --test
          python3 .github/scripts/update-eia-diesel.py
      - name: Publish only changed public benchmark
        run: |
          if git diff --quiet -- data/eia-diesel.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eia-diesel.json
          git commit -m "Refresh EIA weekly national diesel benchmark"
          git push origin HEAD:main
