name: EarnKeep production verification
on:
  push:
    branches: ['qa/production-release']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: earnkeep-production-verify
  cancel-in-progress: true
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production serves approved beta assets
        run: node .github/qa/verify-production.mjs
