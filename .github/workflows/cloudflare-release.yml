name: Verify EarnKeep on Cloudflare

on:
  push:
    branches: [release/earnkeep-final-qa]
    paths: [.github/workflows/cloudflare-release.yml]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EARNKEEP_TEST_URL: https://earnkeep.app/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a33cee0a3e33d999492561bf6ea0dc17b6fc6f20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright-core@1.65.1
      - name: Configure Chrome
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright-core install --with-deps chromium
          fi
      - name: Run published Cloudflare browser workflows with fictional data
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const root=new URL(process.env.EARNKEEP_TEST_URL);
          assert(['a963554e.roadshop.pages.dev','earnkeep.app'].includes(root.hostname));
          let deployed=false;
          for(let attempt=0;attempt<24&&!deployed;attempt++){
            const sw=await fetch(new URL('sw.js?qa='+process.env.GITHUB_RUN_ID,root),{cache:'no-store',signal:AbortSignal.timeout(10000)}).catch(()=>null);
            deployed=Boolean(sw?.ok&&(await sw.text()).includes('roadshop-earnkeep-production-20261127-7'));
            if(!deployed)await new Promise(resolve=>setTimeout(resolve,5000));
          }
          assert(deployed,'Expected production service worker was not served');
          const config=await fetch(new URL('cloud/config.js',root),{signal:AbortSignal.timeout(15000)});
          assert(config.ok);
          const hostname=(await config.text()).match(/https:\/\/([a-z0-9]+\.supabase\.co)/)?.[1];
          assert(hostname,'Expected the approved public Supabase hostname');
          const path='.github/qa/browser-auth-first.mjs';
          const suite=readFileSync(path,'utf8');
          assert(suite.includes('fixture.supabase.co'));
          let checked=suite.replaceAll('fixture.supabase.co',hostname);
          const consoleCheck="  if(msg.type()==='error'&&!msg.text().startsWith('Failed to load resource:'))errors.push(msg.text());";
          const responseCheck=" page.on('response',res=>{";
          const endCheck=" await ctx.close();console.log('PASS browser workflows: '+(sub||label));";
          assert(checked.includes(consoleCheck)&&checked.includes(responseCheck)&&checked.includes(endCheck));
          checked=checked.replace(" let offlineFixture=false;", " let offlineFixture=false,blockedProviderBeacons=0;")
            .replace(consoleCheck, String.raw`  if(root==='https://earnkeep.app/'&&msg.type()==='error'&&/^Loading the script 'https:\/\/static\.cloudflareinsights\.com\/beacon\.min\.js(?:\/[a-z0-9]+)?' violates the following Content Security Policy directive: "script-src 'self'"\..*The action has been blocked\.$/.test(msg.text())){
            blockedProviderBeacons++;return;
           }`+'\n'+consoleCheck)
            .replace(responseCheck,responseCheck+String.raw`
           const url=new URL(res.url());
           if(root==='https://earnkeep.app/'&&((url.hostname==='static.cloudflareinsights.com'&&url.pathname.startsWith('/beacon.min.js'))||(url.origin===new URL(root).origin&&url.pathname==='/cdn-cgi/rum')))errors.push('Unexpected Cloudflare analytics response '+url.pathname);
          `)
            .replace(endCheck," if(blockedProviderBeacons)console.log('Verified '+blockedProviderBeacons+' CSP blocks of Cloudflare-injected analytics; no analytics response reached the browser.');\n"+endCheck);
          writeFileSync(path,checked);
          JS
          node .github/qa/browser-auth-first.mjs
